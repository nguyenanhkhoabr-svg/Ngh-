<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Một món quà cho cún cưng ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    #301525,
                    #120912 55%,
                    #000000
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow: hidden;
        }


        /* =========================
           HỘP NHẬP MẬT KHẨU
        ========================= */

        .box {

            width: 100%;

            max-width: 380px;

            padding: 35px 25px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,105,160,0.45);

            box-shadow:
                0 0 25px
                rgba(255,105,160,0.25),

                inset 0 0 25px
                rgba(255,255,255,0.03);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease,
                filter 1.2s ease;
        }


        /* =========================
           TIM
        ========================= */

        .heart {

            font-size: 55px;

            margin-bottom: 10px;

            animation:
                heartbeat 1.5s infinite;
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        /* =========================
           TIÊU ĐỀ
        ========================= */

        h1 {

            margin:
                5px 0 12px;

            font-size: 26px;

            color: #ff8fba;

            text-shadow:
                0 0 15px
                rgba(255,105,160,0.7);
        }


        p {

            margin-bottom: 25px;

            color: #eeeeee;

            line-height: 1.5;
        }


        /* =========================
           Ô MẬT KHẨU
        ========================= */

        input {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,105,160,0.5);

            background:
                rgba(0,0,0,0.45);

            color: white;

            outline: none;

            text-align: center;

            font-size: 17px;
        }


        input:focus {

            border-color:
                #ff6fa3;

            box-shadow:
                0 0 15px
                rgba(255,105,160,0.35);
        }


        /* =========================
           NÚT
        ========================= */

        button {

            width: 100%;

            margin-top: 15px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff6fa3,
                    #ff9fc2
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px
                rgba(255,105,160,0.35);
        }


        button:active {

            transform:
                scale(0.97);
        }


        /* =========================
           THÔNG BÁO
        ========================= */

        #error {

            margin-top: 12px;

            min-height: 20px;

            color: #ff8cae;

            font-size: 14px;
        }


        /* =========================
           HIỆU ỨNG SAU KHI ĐÚNG
        ========================= */

        .box.success {

            opacity: 0;

            transform:
                scale(1.15);

            filter:
                blur(8px);
        }

    </style>

</head>


<body>


    <div class="box">

        <div class="heart">
            ❤️
        </div>


        <h1>
            Có một điều dành cho Nghé=))...
        </h1>


        <p>
            Đây là một món quà nhỏ tui dành cho cvang.<br>
            Nhưng trước khi mở,<br>
            Cvang phải biết mật khẩu đó nha 
            ,tự mò được mới lạ=))❤️
        </p>


        <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu..."
            autocomplete="off"
        >


        <button id="openBtn">
            💌 Mở món quà
        </button>


        <div id="error"></div>

    </div>


    <script>

        /* =========================
           MẬT KHẨU
        ========================= */

        const PASSWORD = "25112009";


        const passwordInput =
            document.getElementById(
                "password"
            );


        const openBtn =
            document.getElementById(
                "openBtn"
            );


        const error =
            document.getElementById(
                "error"
            );


        /* =========================
           MỞ MÓN QUÀ
        ========================= */

        function openGift() {

            const password =
                passwordInput.value.trim();


            /* MẬT KHẨU ĐÚNG */

            if (password === PASSWORD) {

                error.textContent =
                    "Clm giỏi v vợ=))... ❤️";


                document
                    .querySelector(".box")
                    .classList.add("success");


                setTimeout(() => {

                    window.location.href =
                        "love.html";

                }, 1800);


            }

            /* MẬT KHẨU SAI */

            else {

                error.textContent =
                    "Tào lao rồi vợ ơi,sai làm chó =))... 💗";


                passwordInput.value =
                    "";


                passwordInput.focus();

            }

        }


        /* =========================
           BẤM NÚT
        ========================= */

        openBtn.addEventListener(
            "click",
            openGift
        );


        /* =========================
           NHẤN ENTER
        ========================= */

        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    openGift();

                }

            }
        );

    </script>


</body>

</html>
