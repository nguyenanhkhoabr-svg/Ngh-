<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Một điều muốn nói ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Nền ký tự -->
    <canvas id="matrix"></canvas>


    <!-- Nội dung chính -->
    <main id="message">

        <div id="text"></div>

        <canvas id="heartCanvas"></canvas>

        <!-- Nút nhận quà -->
        <button id="giftBtn">
            🎁 Nhận quà cho bạn
        </button>

    </main>


    <!-- Nút bắt đầu -->
    <button id="start">
        Chạm vào màn hình ❤️
    </button>


    <!-- Nhạc -->
    <audio id="music" loop>
        <source src="music/love.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>

</html>
